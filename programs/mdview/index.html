<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
		<title>MDView</title>
		<link href="../../lib/os-gui/layout.css" rel="stylesheet" type="text/css">
		<link href="../../lib/os-gui/windows-98.css" rel="stylesheet" type="text/css">
		<link href="../../font/fixedsys-excelsior/fsex300.css" rel="stylesheet" type="text/css">
		<link rel="icon" href="../../images/icons/md-16x16.png" sizes="16x16" type="image/png">
		<link rel="icon" href="../../images/icons/md-32x32.png" sizes="32x32" type="image/png">
		<meta name="viewport" content="width=device-width, user-scalable=no">
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: var(--ButtonFace);
			}
			#document {
				box-sizing: border-box;
				height: 100%;
				overflow: auto;
				padding: 4px 12px;
				background: var(--Window);
				color: var(--WindowText);
				font-family: Arial, sans-serif;
				font-size: 14px;
				line-height: 1.4;
				user-select: text;
				cursor: auto;
			}
			#document pre,
			#document code {
				font-family: "Fixedsys Excelsior", "FixedSys", monospace;
				font-size: 16px; /* NOTE: FixedSys should be 15px, but Fixedsys Excelsior is 16px */
			}
			#document pre {
				overflow: auto;
				padding: 4px;
				background: var(--ButtonFace);
			}
			#document img {
				max-width: 100%;
			}
			#document blockquote {
				margin-left: 0;
				padding-left: 10px;
				border-left: 3px solid var(--ButtonShadow);
			}
			#document table {
				border-collapse: collapse;
			}
			#document th,
			#document td {
				border: 1px solid var(--ButtonShadow);
				padding: 2px 6px;
			}
		</style>
	</head>
	<body>
		<div id="document" class="inset-deep"></div>
		<script src="../../lib/jquery.min.js"></script>
		<script src="../../lib/browserfs.js"></script>
		<script src="../../src/filesystem-setup.js"></script>
		<script src="../../src/helpers.js"></script>
		<script src="../../lib/os-gui/$Window.js"></script>
		<script src="../../src/msgbox.js"></script>
		<script src="lib/markdown-it.umd.min.js"></script>
		<script src="src/app.js"></script>
	</body>
</html>
